<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe — BENILAB Digital360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%; max-width: 420px;
            box-shadow: var(--shadow);
        }
        .reset-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem; font-weight: 400; margin-bottom: 0.5rem;
        }
        .reset-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 2rem; line-height: 1.6; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .form-input {
            width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 16px; color: var(--text-primary);
            font-family: 'Outfit', sans-serif; font-size: 14px; outline: none; transition: border-color 0.3s;
        }
        .form-input:focus { border-color: var(--accent); }
        .form-input::placeholder { color: var(--text-muted); }
        .error-msg { color: var(--error); font-size: 13px; margin-bottom: 1rem; min-height: 20px; }
        .success-box {
            display: none; text-align: center; padding: 1rem 0;
        }
        .success-box .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .success-box h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 400; margin-bottom: 0.5rem; }
        .success-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 1.5rem; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 13px; color: var(--text-muted); }
        .back-link:hover { color: var(--accent); }
        .password-strength { font-size: 11px; margin-top: 4px; }
        .password-strength.weak { color: var(--error); }
        .password-strength.medium { color: var(--warning); }
        .password-strength.strong { color: var(--success); }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="reset-card">
        <a href="index.html" style="text-decoration:none;color:inherit;">
            <div style="font-size:14px;font-weight:700;margin-bottom:2rem;">BENILAB <em style="color:var(--accent);font-family:'Playfair Display',serif;">Digital360</em></div>
        </a>

        <div id="resetForm">
            <h1>Réinitialiser le mot de passe</h1>
            <p>Choisissez un nouveau mot de passe pour votre compte.</p>
            <div class="error-msg" id="resetError"></div>
            <form onsubmit="handleReset(event)">
                <div class="form-group">
                    <label class="form-label">Nouveau mot de passe</label>
                    <input type="password" class="form-input" id="resetPassword" required placeholder="10 caractères minimum" minlength="10" oninput="checkStrength(this.value)">
                    <div class="password-strength" id="strengthText"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" class="form-input" id="resetConfirm" required placeholder="Retapez le mot de passe">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Réinitialiser</button>
            </form>
            <a href="forgot-password.html" class="back-link">← Retour</a>
        </div>

        <div id="resetSuccess" class="success-box">
            <div class="icon">✅</div>
            <h2>Mot de passe modifié</h2>
            <p>Votre mot de passe a été mis à jour avec succès. Vous pouvez maintenant vous connecter.</p>
            <a href="index.html" class="btn btn-primary btn-block">Se connecter</a>
        </div>
    </div>

    <script>
    const D360_API_BASE = window.D360_API_BASE
        || (['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:8000/api/v1' : '/api/v1');
    let _csrfToken = '';

    async function getCsrf() {
        try {
            const res = await fetch(D360_API_BASE + '/auth/csrf', { credentials: 'include' });
            const data = await res.json();
            _csrfToken = data.csrf_token || '';
        } catch (_) {}
    }

    function csrfHeaders() {
        return _csrfToken ? { 'X-CSRF-Token': _csrfToken } : {};
    }

    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function checkStrength(pw) {
        const el = document.getElementById('strengthText');
        if (!pw) { el.textContent = ''; el.className = 'password-strength'; return; }
        let score = 0;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        const labels = ['', 'Faible', 'Moyen', 'Fort', 'Très fort'];
        const classes = ['', 'weak', 'medium', 'strong', 'strong'];
        el.textContent = labels[score] || '';
        el.className = 'password-strength ' + (classes[score] || '');
    }

    async function handleReset(e) {
        e.preventDefault();
        const password = document.getElementById('resetPassword').value;
        const confirm = document.getElementById('resetConfirm').value;
        const token = getQueryParam('token');
        const errorEl = document.getElementById('resetError');
        errorEl.textContent = '';

        if (!token) {
            errorEl.textContent = 'Lien invalide. Demandez un nouveau mot de passe oublié.';
            return;
        }
        if (password !== confirm) {
            errorEl.textContent = 'Les mots de passe ne correspondent pas.';
            return;
        }
        try {
            await fetch(D360_API_BASE + '/auth/reset-password', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', ...csrfHeaders() },
                body: JSON.stringify({ token, password }),
            });
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('resetSuccess').style.display = 'block';
        } catch (err) {
            if (err.code === 'INVALID_TOKEN' || err.code === 'TOKEN_EXPIRED') {
                errorEl.textContent = 'Ce lien a expiré ou est invalide. Demandez un nouveau mot de passe oublié.';
            } else {
                errorEl.textContent = err.detail || 'Une erreur est survenue.';
            }
        }
    }

    getCsrf();
    </script>
</body>
</html>
