name: platform

on:
  push:
    branches: [master]
    paths: ["platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digital360
          POSTGRES_PASSWORD: digital360
          POSTGRES_DB: digital360_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U digital360 -d digital360_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://digital360:digital360@localhost:5432/digital360_test
      TEST_DATABASE_URL: postgresql+asyncpg://digital360:digital360@localhost:5432/digital360_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: Installer
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Typage
        run: mypy src

      - name: Frontières entre modules
        run: lint-imports

      - name: Migrations réversibles
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests (unitaires + intégration)
        run: pytest -ra

      - name: Audit des dépendances
        run: pip-audit --skip-editable
