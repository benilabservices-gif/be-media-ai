# Environnement de développement local : `docker compose up --build`
# Le stockage objet (MinIO) sera ajouté avec l'étape qui l'utilise.

x-app-env: &app-env
  # Rôle applicatif non superuser (créé par docker/postgres-init) : la RLS s'applique
  DATABASE_URL: postgresql+asyncpg://digital360:digital360@postgres:5432/digital360

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Superuser réservé à l'administration ; l'application ne l'utilise jamais
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital360"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Étape de release : migrations puis publication de la configuration métier, avant l'API
  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m digital360.cli seed-config"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "digital360.worker"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
